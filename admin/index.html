<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Uploads – admin</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1b2430; --mute:#5b6b7e; --line:#dde3ea; --accent:#1f6feb; --warn:#b8801a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171d; --card:#1a2129; --ink:#e6ebf1; --mute:#9aa8b8; --line:#2a343f; --accent:#5aa2ff; --warn:#e0b050; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, Segoe UI, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .sub { color:var(--mute); margin:0 0 16px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  button, .btn { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mute); font-weight:600; font-size:.85rem; }
  tr:last-child td { border-bottom:0; }
  .name { font-weight:600; }
  .orig { color:var(--mute); font-size:.85rem; }
  .tag { font-size:.75rem; padding:1px 6px; border-radius:10px; border:1px solid var(--warn); color:var(--warn); margin-left:6px; }
  .num { text-align:right; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tabs button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tag.ok { border-color:#2e9e5b; color:#2e9e5b; }
  #lib { color:var(--mute); font-size:.85rem; margin:0 0 12px; }
  #msg { color:var(--mute); padding:14px; }
  #msg.err { color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1>Uploaded plots</h1>
  <p class="sub">Files visitors sent in. Download them under their own names, ready for the public library.</p>
  <div class="bar">
    <button id="zip" class="primary" disabled>Download selected as ZIP</button>
    <button id="reload">Refresh</button>
    <button id="rescan" title="Read every file in publicPlotLibrary again">Rescan library</button>
    <span id="count" class="sub" style="margin:0"></span>
  </div>
  <div class="bar tabs" role="group" aria-label="Show">
    <button id="tNew" aria-pressed="true">New</button>
    <button id="tIn" aria-pressed="false">Already in library</button>
    <button id="tAll" aria-pressed="false">All</button>
  </div>
  <p id="lib"></p>
  <div class="card">
    <div id="msg">Loading…</div>
    <table id="tbl" hidden>
      <thead><tr>
        <th><input type="checkbox" id="all" aria-label="Select all"></th>
        <th>Name</th><th class="num">Size</th><th class="num">Sent</th><th>First</th><th>Last</th><th></th>
      </tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function () {
  var rows = [], view = "new", lib = { total: 0, scanned: 0, needsSetup: false }, unreadable = [], scanning = false;
  var $ = function (id) { return document.getElementById(id); };

  function fmtSize(n) { return n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB"; }
  function fmtDate(s) { var d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function say(text, err) { var m = $("msg"); m.textContent = text; m.className = err ? "err" : ""; m.hidden = !text; }
  function post(url, body) {
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error("Server said " + r.status); return r.json(); });
  }

  function visible() {
    return rows.filter(function (r) {
      return view === "all" || (view === "in" ? r.sameAs.length > 0 : r.sameAs.length === 0);
    });
  }
  function selected() {
    return visible().filter(function (r) { var c = document.getElementById("c" + r.id); return c && c.checked; });
  }
  function updateButtons() {
    var n = selected().length;
    $("zip").disabled = n === 0;
    $("zip").textContent = n ? "Download " + n + " as ZIP" : "Download selected as ZIP";
  }
  function countOf(fn) { return rows.filter(fn).length; }

  function libLine() {
    var t = $("lib");
    if (lib.needsSetup) { t.textContent = "Library comparison is not set up yet: create the library_files table in the database (see the instructions), then press Refresh."; return; }
    var s = "Library: " + lib.scanned + " of " + lib.total + " files compared by content.";
    if (scanning) s = "Comparing with the library… " + lib.scanned + " of " + lib.total;
    if (unreadable.length) s += " Could not read: " + unreadable.join(", ") + ".";
    t.textContent = s;
  }

  function render() {
    $("tNew").textContent = "New (" + countOf(function (r) { return r.sameAs.length === 0; }) + ")";
    $("tIn").textContent = "Already in library (" + countOf(function (r) { return r.sameAs.length > 0; }) + ")";
    $("tAll").textContent = "All (" + rows.length + ")";
    ["tNew", "tIn", "tAll"].forEach(function (id) {
      $(id).setAttribute("aria-pressed", String((id === "tNew" && view === "new") || (id === "tIn" && view === "in") || (id === "tAll" && view === "all")));
    });

    var list = visible();
    var body = $("body"); body.textContent = "";
    list.forEach(function (r) {
      var tr = document.createElement("tr");
      var td = function (cls) { var t = document.createElement("td"); if (cls) t.className = cls; tr.appendChild(t); return t; };

      var c = document.createElement("input"); c.type = "checkbox"; c.id = "c" + r.id;
      c.addEventListener("change", updateButtons); td().appendChild(c);

      var t = td();
      var nm = document.createElement("div"); nm.className = "name"; nm.textContent = r.exportName;
      if (r.sameAs.length) {
        var ok = document.createElement("span"); ok.className = "tag ok"; ok.textContent = "same plot as " + r.sameAs.join(", ");
        nm.appendChild(ok);
      } else if (r.nameTaken) {
        var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "name used by a different library plot";
        nm.appendChild(tag);
      }
      t.appendChild(nm);
      if (r.originalName && r.originalName !== r.exportName) {
        var o = document.createElement("div"); o.className = "orig"; o.textContent = "sent as " + r.originalName; t.appendChild(o);
      }
      td("num").textContent = fmtSize(r.size);
      td("num").textContent = r.timesSeen + "×";
      td().textContent = fmtDate(r.firstSeen);
      td().textContent = fmtDate(r.lastSeen);

      var a = document.createElement("a"); a.className = "btn"; a.textContent = "Download";
      a.href = "/admin/api/file?id=" + r.id; td().appendChild(a);
      body.appendChild(tr);
    });
    $("tbl").hidden = list.length === 0;
    $("all").checked = false;
    $("count").textContent = list.length + " shown";
    say(list.length ? "" : (rows.length ? (view === "new" ? "Nothing new: every upload is already in the library." : "Nothing here.") : "No uploads yet."));
    libLine();
    updateButtons();
  }

  function load() {
    say("Loading…");
    return fetch("/admin/api/list", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(r.status === 403 ? "Not signed in (403)" : "Server said " + r.status);
      return r.json();
    }).then(function (j) { rows = j.rows; lib = j.library; render(); })
      .catch(function (e) { $("tbl").hidden = true; say("Could not load the list: " + e.message, true); });
  }

  // read the library files a few at a time, then reload the list
  function scan(restart) {
    if (scanning || lib.needsSetup) return Promise.resolve();
    scanning = true; unreadable = [];
    function step(first) {
      return post("/admin/api/sync-library", { restart: !!(first && restart), skip: unreadable }).then(function (j) {
        lib.total = j.total; lib.scanned = j.scanned;
        unreadable = unreadable.concat(j.failed || []);
        libLine();
        return j.remaining > 0 ? step(false) : j;
      });
    }
    return step(true).catch(function (e) { $("lib").textContent = "Library comparison failed: " + e.message; })
      .then(function () { scanning = false; return load(); });
  }

  function setView(v) { view = v; render(); }
  $("tNew").addEventListener("click", function () { setView("new"); });
  $("tIn").addEventListener("click", function () { setView("in"); });
  $("tAll").addEventListener("click", function () { setView("all"); });

  $("all").addEventListener("change", function () {
    visible().forEach(function (r) { document.getElementById("c" + r.id).checked = $("all").checked; });
    updateButtons();
  });
  $("reload").addEventListener("click", function () { load().then(function () { if (lib.scanned < lib.total) scan(false); }); });
  $("rescan").addEventListener("click", function () { scan(true); });

  $("zip").addEventListener("click", function () {
    var picked = selected();
    if (!picked.length) return;
    if (typeof JSZip === "undefined") { say("The ZIP helper did not load. Use the Download buttons instead.", true); return; }
    var btn = $("zip"); btn.disabled = true; btn.textContent = "Preparing…";
    var zip = new JSZip();
    Promise.all(picked.map(function (r) {
      return fetch("/admin/api/file?id=" + r.id).then(function (resp) {
        if (!resp.ok) throw new Error(r.exportName + ": " + resp.status);
        return resp.blob();
      }).then(function (b) { zip.file(r.exportName, b); });
    })).then(function () { return zip.generateAsync({ type: "blob" }); })
      .then(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "plots.zip"; a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      })
      .catch(function (e) { say("ZIP failed: " + e.message, true); })
      .then(updateButtons);
  });

  load().then(function () { if (!lib.needsSetup && lib.scanned < lib.total) scan(false); });
})();
</script>
</body>
</html>
