<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Messages – admin</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1b2430; --mute:#5b6b7e; --line:#dde3ea; --accent:#1f6feb; --warn:#b8801a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171d; --card:#1a2129; --ink:#e6ebf1; --mute:#9aa8b8; --line:#2a343f; --accent:#5aa2ff; --warn:#e0b050; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, Segoe UI, sans-serif; }
  main { max-width:900px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .sub { color:var(--mute); margin:0 0 16px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  button, .btn { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; }
  button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .msg.unread { border-left:4px solid var(--accent); }
  .head { display:flex; gap:8px; flex-wrap:wrap; align-items:baseline; margin-bottom:6px; }
  .topic { font-weight:600; }
  .tag { font-size:.75rem; padding:1px 7px; border-radius:10px; border:1px solid var(--warn); color:var(--warn); }
  .when, .from, .ctx { color:var(--mute); font-size:.85rem; }
  .body { white-space:pre-wrap; overflow-wrap:anywhere; margin:6px 0 10px; }
  .files { display:flex; flex-wrap:wrap; gap:6px 14px; margin:0 0 10px; font-size:.9rem; }
  .files a::before { content:"📎 "; }
  .actions { display:flex; gap:8px; }
  .actions button { font-size:.85rem; padding:4px 10px; }
  #status.err { color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1>Messages</h1>
  <p class="sub">What visitors sent with the Contact form. <a href="./">Uploaded plots →</a></p>
  <div class="bar">
    <button id="fUnread" aria-pressed="true">Unread</button>
    <button id="fAll" aria-pressed="false">All</button>
    <button id="reload">Refresh</button>
    <button id="testMail" title="Send one notification email to check the setup">Send test email</button>
    <span id="count" class="sub" style="margin:0"></span>
  </div>
  <p id="status">Loading…</p>
  <div id="list"></div>
</main>
<script>
(function () {
  var rows = [], showAll = false;
  var list = document.getElementById("list"), status = document.getElementById("status");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function post(body) {
    return fetch("/admin/api/messages", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) }).then(function (r) { if (!r.ok) throw new Error(r.status); });
  }
  function when(s) {               // stored as UTC "YYYY-MM-DD HH:MM:SS"
    var d = new Date(String(s).replace(" ", "T") + "Z");
    return isNaN(d) ? s : d.toLocaleString();
  }

  function render() {
    var shown = rows.filter(function (r) { return showAll || !r.is_read; });
    var unread = rows.filter(function (r) { return !r.is_read; }).length;
    document.getElementById("count").textContent = unread + " unread · " + rows.length + " total";
    list.innerHTML = "";
    status.textContent = shown.length ? "" : (showAll ? "No messages yet." : "No unread messages.");
    shown.forEach(function (r) {
      var card = el("div", "msg" + (r.is_read ? "" : " unread"));
      var head = el("div", "head");
      head.appendChild(el("span", "topic", r.topic || "Message"));
      if (r.plotter) head.appendChild(el("span", "tag", r.plotter));
      head.appendChild(el("span", "when", when(r.created)));
      card.appendChild(head);

      var from = el("div", "from");
      from.appendChild(document.createTextNode(r.name ? r.name : "No name given"));
      if (r.email) {
        from.appendChild(document.createTextNode(" · "));
        var a = el("a", null, r.email);
        a.href = "mailto:" + r.email + "?subject=" + encodeURIComponent("Re: " + (r.topic || "your message"));
        from.appendChild(a);
      }
      card.appendChild(from);
      card.appendChild(el("div", "body", r.body));
      if (r.files && r.files.length) {
        var fl = el("div", "files");
        r.files.forEach(function (f) {
          var a = el("a", null, f.name + " (" + (f.size < 1048576 ? Math.ceil(f.size / 1024) + " KB" : (f.size / 1048576).toFixed(1) + " MB") + ")");
          a.href = "/admin/api/messages?file=" + encodeURIComponent(f.key);
          fl.appendChild(a);
        });
        card.appendChild(fl);
      }
      if (r.context) card.appendChild(el("div", "ctx", "Site settings when sent: " + r.context));

      var act = el("div", "actions");
      var tog = el("button", null, r.is_read ? "Mark unread" : "Mark read");
      tog.onclick = function () {
        post({ id: r.id, action: r.is_read ? "unread" : "read" }).then(function () {
          r.is_read = r.is_read ? 0 : 1; render();
        }).catch(fail);
      };
      var del = el("button", null, "Delete");
      del.onclick = function () {
        if (!confirm("Delete this message" + (r.files && r.files.length ? " and its attached files" : "") + "?")) return;
        post({ id: r.id, action: "delete" }).then(function () {
          rows = rows.filter(function (x) { return x.id !== r.id; }); render();
        }).catch(fail);
      };
      act.appendChild(tog); act.appendChild(del);
      card.appendChild(act);
      list.appendChild(card);
    });
  }
  function fail(e) { status.className = "err"; status.textContent = "Something went wrong (" + e.message + ")."; }
  function load() {
    status.className = ""; status.textContent = "Loading…";
    fetch("/admin/api/messages", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (j) { rows = j.rows || []; render(); }).catch(fail);
  }
  function setFilter(all) {
    showAll = all;
    document.getElementById("fAll").setAttribute("aria-pressed", String(all));
    document.getElementById("fUnread").setAttribute("aria-pressed", String(!all));
    render();
  }
  document.getElementById("fUnread").onclick = function () { setFilter(false); };
  document.getElementById("fAll").onclick = function () { setFilter(true); };
  document.getElementById("reload").onclick = load;
  document.getElementById("testMail").onclick = function () {
    var b = this; b.disabled = true; status.className = ""; status.textContent = "Sending a test email…";
    fetch("/admin/api/test-email", { method: "POST" }).then(function (r) { return r.json(); })
      .then(function (j) {
        status.className = j.sent ? "" : "err";
        status.textContent = j.sent ? "Test email sent to " + j.to + ". Check your inbox." : "Not sent. " + j.reason;
      }).catch(fail).then(function () { b.disabled = false; });
  };
  load();
})();
</script>
</body>
</html>
